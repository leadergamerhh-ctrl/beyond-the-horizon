let TOUCH = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
let GAMECSS = { l: 0, t: 0, w: 1, h: 1 };
let TITLE_MODE = false; // title screen: the painted art fills the whole screen and the pixel UI floats over it
function resize() {
  DPR = window.devicePixelRatio || 1;
  const vw = window.innerWidth, vh = window.innerHeight;
  PORT = vh > vw * 1.05;
  if (TITLE_MODE && window.TitleArt) {
    const k = TitleArt.resize(vw, vh);
    SC = Math.max(1, Math.round(k * DPR));
    W = Math.ceil(vw * DPR / SC); H = Math.ceil(vh * DPR / SC);
    cv.width = W; cv.height = H;
    const cw = W * SC / DPR, ch = H * SC / DPR;
    GAMECSS = { l: 0, t: 0, w: cw, h: ch };
    Object.assign(cv.style, { width: cw + 'px', height: ch + 'px', left: '0px', top: '0px' });
    PW = Math.ceil(vw * DPR / SC); PH = Math.ceil(vh * DPR / SC); PADTOP = PH;
    padC.width = PW; padC.height = PH;
    Object.assign(padC.style, { width: (PW * SC / DPR) + 'px', height: (PH * SC / DPR) + 'px' });
    ctx.imageSmoothingEnabled = false; pctx.imageSmoothingEnabled = false;
    if (window.Pad) Pad.layout();
    return;
  }
  let gh = vh;
  if (TOUCH && PORT) gh = Math.round(vh - clamp(vh * 0.36, 180, 330));
  const aw = vw * DPR, ah = gh * DPR;
  const tw = PORT ? 226 : 304, th = PORT ? 236 : 190;
  SC = Math.max(1, Math.floor(Math.min(aw / tw, ah / th)));
  W = Math.floor(aw / SC); H = Math.floor(ah / SC);
  while (W > 520 || H > (PORT ? 440 : 330)) { SC++; W = Math.floor(aw / SC); H = Math.floor(ah / SC); }
  cv.width = W; cv.height = H;
  const cw = W * SC / DPR, ch = H * SC / DPR;
  GAMECSS = { l: (vw - cw) / 2, t: (TOUCH && PORT) ? (gh - ch) / 2 : (vh - ch) / 2, w: cw, h: ch };
  Object.assign(cv.style, { width: cw + 'px', height: ch + 'px', left: GAMECSS.l + 'px', top: GAMECSS.t + 'px' });
  PW = Math.ceil(vw * DPR / SC); PH = Math.ceil(vh * DPR / SC);
  padC.width = PW; padC.height = PH;
  Object.assign(padC.style, { width: (PW * SC / DPR) + 'px', height: (PH * SC / DPR) + 'px' });
  PADTOP = Math.round(gh * DPR / SC);
  ctx.imageSmoothingEnabled = false; pctx.imageSmoothingEnabled = false;
  if (window.Pad) Pad.layout();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- input ---------- */
const KEYMAP = {
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  KeyZ: 'a', Space: 'a', Enter: 'a', KeyE: 'a', KeyX: 'b', Backspace: 'b', Escape: 'menu', Tab: 'menu', KeyC: 'menu',
  ShiftLeft: 'run', ShiftRight: 'run', KeyR: 'bike', KeyF: 'bike', KeyQ: 'quests', KeyI: 'bag', KeyM: 'map',
  Digit1: 'e1', Digit2: 'e2', Digit3: 'e3', Digit4: 'e4', Digit5: 'e5', Digit6: 'e6', Digit7: 'e7', Digit8: 'e8'
};
const Input = {
  kd: {}, vd: {}, latch: {}, prev: {}, cur: {}, rept: {}, typed: [], clicks: [], mouse: { x: -1, y: -1, moved: false, inside: false }, anyKey: false, lastKeyT: 0,
  down(b) { return !!this.cur[b]; },
  p(b) { return !!this.cur[b] && !this.prev[b]; },
  rep(b) { return !!this.rept[b]; },
  update(dt) {
    this.prev = this.cur; this.cur = {};
    for (const k in this.kd) if (this.kd[k]) this.cur[KEYMAP[k]] = 1;
    for (const k in this.vd) if (this.vd[k]) this.cur[k] = 1;
    for (const k in this.latch) this.cur[k] = 1;
    this.latch = {};
    this.rept = {};
    for (const b of ['up', 'down', 'left', 'right', 'a', 'b']) {
      if (this.cur[b]) {
        if (!this.prev[b]) { this.rept[b] = 1; this['t_' + b] = 0.32; }
        else { this['t_' + b] -= dt; if (this['t_' + b] <= 0) { this.rept[b] = 1; this['t_' + b] = 0.075; } }
      }
    }
  },
  dirHeld() {
    // most-recently pressed direction wins
    let best = null, bt = -1;
    for (const d of ['up', 'down', 'left', 'right']) if (this.cur[d] && (this['ts_' + d] || 0) > bt) { bt = this['ts_' + d] || 0; best = d; }
    return best;
  },
  endFrame() { this.clicks.length = 0; this.typed.length = 0; this.mouse.moved = false; this.anyKey = false; },
  consume() { for (const b in this.cur) this.prev[b] = 1; this.clicks.length = 0; },
  click() { return this.clicks.length ? this.clicks[0] : null; }
};
let _tsc = 0;
window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const m = KEYMAP[e.code];
  if (m) { e.preventDefault(); if (!Input.kd[e.code]) { Input['ts_' + m] = ++_tsc; Input.latch[m] = 1; } }
  Input.kd[e.code] = true; Input.anyKey = true; Input.lastKeyT = performance.now();
  if (e.key && e.key.length === 1) Input.typed.push(e.key);
  else if (e.key === 'Backspace') Input.typed.push('\b');
  else if (e.key === 'Enter') Input.typed.push('\n');
  if (typeof AU !== 'undefined') AU.unlock();
});
window.addEventListener('keyup', e => { Input.kd[e.code] = false; });
window.addEventListener('blur', () => { Input.kd = {}; Input.vd = {}; });

function toGame(cx, cy) { return { x: (cx - GAMECSS.l) / GAMECSS.w * W, y: (cy - GAMECSS.t) / GAMECSS.h * H }; }
function toPad(cx, cy) { return { x: cx * DPR / SC, y: cy * DPR / SC }; }
const ptrs = new Map();
window.addEventListener('pointerdown', e => {
  if (typeof AU !== 'undefined') AU.unlock();
  if (e.pointerType === 'touch' && !TOUCH) { TOUCH = true; resize(); }
  const pp = toPad(e.clientX, e.clientY);
  if (TOUCH && window.Pad) { const hit = Pad.hit(pp.x, pp.y); if (hit) { ptrs.set(e.pointerId, { pad: true, hit }); Pad.press(e.pointerId, hit, pp.x, pp.y); e.preventDefault(); return; } }
  const gp = toGame(e.clientX, e.clientY);
  if (gp.x >= 0 && gp.y >= 0 && gp.x < W && gp.y < H) {
    Input.clicks.push({ x: gp.x | 0, y: gp.y | 0, touch: e.pointerType !== 'mouse' });
    Input.mouse.x = gp.x | 0; Input.mouse.y = gp.y | 0;
    ptrs.set(e.pointerId, { pad: false, sx: gp.x, sy: gp.y });
  }
  e.preventDefault();
}, { passive: false });
window.addEventListener('pointermove', e => {
  const st = ptrs.get(e.pointerId);
  if (st && st.pad) { const pp = toPad(e.clientX, e.clientY); Pad.move(e.pointerId, pp.x, pp.y); return; }
  const gp = toGame(e.clientX, e.clientY);
  if (e.pointerType === 'mouse') { Input.mouse.x = gp.x | 0; Input.mouse.y = gp.y | 0; Input.mouse.moved = true; Input.mouse.inside = gp.x >= 0 && gp.y >= 0 && gp.x < W && gp.y < H; }
});
function ptrUp(e) { const st = ptrs.get(e.pointerId); if (st && st.pad) Pad.release(e.pointerId); ptrs.delete(e.pointerId); }
window.addEventListener('pointerup', ptrUp); window.addEventListener('pointercancel', ptrUp);
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('wheel', e => { if (window.UIWheel) UIWheel(Math.sign(e.deltaY)); }, { passive: true });

/* hit-test helper for immediate-mode UI: rect clicked this frame? */
function clickedIn(x, y, w, h) { for (const c of Input.clicks) if (c.x >= x && c.y >= y && c.x < x + w && c.y < y + h) return true; return false; }
function hoverIn(x, y, w, h) { const m = Input.mouse; return m.inside && m.x >= x && m.y >= y && m.x < x + w && m.y < y + h; }

const FONT_H = 9;
const GL = {};

const _fa = {};
function fontAtlas(col) {
  let a = _fa[col]; if (a) return a;
  let x = 0; const pos = {};
  for (const k in GL) { pos[k] = x; x += GL[k].w + 1; }
  const c = mk(x, FONT_H); c.x.fillStyle = col;
  for (const k in GL) { const g = GL[k]; g.rows.forEach((r, y) => { for (let i = 0; i < r.length; i++) if (r[i] === '#') c.x.fillRect(pos[k] + i, y, 1, 1); }); }

const TC = { w: null, y: '#ffd76a', g: '#9ae67e', r: '#ff8f7d', b: '#8fd0ff', o: '#ffb35e', p: '#ffa6d6', k: '#3a3048', d: '#8b7f9c' };

function tw(s) {
  let w = 0; s = String(s);
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '{') { const j = s.indexOf('}', i); if (j > 0) { i = j; continue; } }
    const g = GL[ch] || GL['?']; w += g.w + 1;
  }
  return Math.max(0, w - 1);
}
// draw text; colour codes {y}..{/} switch colour; returns width
function txt(s, x, y, col = '#f5ecd7', sh = '#1a1426', g = ctx, alt = TC) {
  s = String(s); x = Math.round(x); y = Math.round(y);
  if (sh) _txt(s, x + 1, y + 1, sh, g, true, alt);
  return _txt(s, x, y, col, g, false, alt);
}
function _txt(s, x, y, col, g, isShadow, alt) {
  let cx = x, cur = col;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '{') { const j = s.indexOf('}', i); if (j > 0) { const code = s.slice(i + 1, j); if (!isShadow) cur = (code === '/' || !alt[code]) ? col : alt[code]; i = j; continue; } }
    const gg = GL[ch] || GL['?']; const fa = fontAtlas(cur);
    g.drawImage(fa.c, fa.pos[GL[ch] ? ch : '?'], 0, gg.w, FONT_H, cx, y, gg.w, FONT_H);
    cx += gg.w + 1;
  }
  return cx - x - 1;
}
function txtC(s, cx, y, col, sh, g) { return txt(s, Math.round(cx - tw(s) / 2), y, col, sh, g); }
function txtR(s, rx, y, col, sh, g) { return txt(s, rx - tw(s), y, col, sh, g); }
function wrap(s, maxW) {
  const out = [];
  for (const para of String(s).split('\n')) {
    const words = para.split(' '); let line = '';
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (tw(t) > maxW && line) { out.push(line); line = w; } else line = t;
    }
    out.push(line);
  }
  return out;
}

  for (let i = 0; i < teeth; i++) { const a = ang + i * TAU / teeth; const x = cx + Math.cos(a) * (r + 1), y = cy + Math.sin(a) * (r + 1); g.fillRect(Math.round(x - 2), Math.round(y - 2), 4, 4); }
  for (let y = -r; y <= r; y++) { const w = Math.round(Math.sqrt(r * r - y * y)); g.fillStyle = y < -r * 0.3 ? lt(col, .2) : y > r * 0.4 ? dk(col, .2) : col; g.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1); }
  g.fillStyle = dk(col, .5); g.fillRect(Math.round(cx - 2), Math.round(cy - 2), 5, 5);
  for (let i = 0; i < 4; i++) { const a = ang + i * TAU / 4; g.fillRect(Math.round(cx + Math.cos(a) * r * 0.6 - 1), Math.round(cy + Math.sin(a) * r * 0.6 - 1), 3, 3); }
}

class GMap {
  constructor(id, w, h, o = {}) {
    Object.assign(this, { id, w, h }, o);
    this.t = new Uint8Array(w * h); this.solid = new Uint8Array(w * h); this.noDecor = new Uint8Array(w * h);
    this.objs = []; this.warps = {}; this.acts = {}; this.cache = {}; this.edge = TER.GRASS; this.spawns = {};
  }
  i(x, y) { return y * this.w + x; }
  in(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
  T(x, y) { return this.in(x, y) ? this.t[this.i(x, y)] : this.edge; }
  set(x, y, t) { if (this.in(x, y)) this.t[this.i(x, y)] = t; }
  fill(x0, y0, x1, y1, t) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) this.set(x, y, t); }
  block(x, y, v = 1) { if (this.in(x, y)) this.solid[this.i(x, y)] = v; }
  blockR(x0, y0, x1, y1) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) this.block(x, y); }
  isSolid(x, y) {
    if (!this.in(x, y)) return true;
    if (this.solid[this.i(x, y)]) return true;
    const t = this.t[this.i(x, y)];
    return t === TER.WATER || t === TER.DEEP || t === TER.CLIFF || t === TER.HIGH || t === TER.FALL || t === TER.FARM;
  }
  free(x, y) { return this.in(x, y) && !this.solid[this.i(x, y)]; }
  warp(x, y, w) { this.warps[this.i(x, y)] = w; }
  act(x, y, a) { this.acts[this.i(x, y)] = a; }
  add(o) { this.objs.push(o); return o; }
}

    const listN = MP.on ? MP.players.size + 1 : 0;
    const head = MP.on ? (MP.host ? 46 : 22) + listN * 11 : 40, h = head + its.length * 13 + 12;
    const x = Math.round((W - w) / 2), y = Math.round(Math.max(4, (H - h) / 2));
    panel(x, y, w, h, 'dark'); icon('people', x + 7, y + 6); txt('Co-op', x + 19, y + 5, '#ffd76a');
    let yy = y + 18;
    if (!MP.on) { wrap('Play Cedar Falls with up to 3 friends. Free, no account needed.', w - 16).forEach((l, i) => txt(l, x + 8, yy + i * 10, '#c8bce0', null)); yy += 22; }
    else {
      if (MP.host) { txtC('Invite code', x + w / 2, yy, '#9a8fb8', null); const big = logoImg(MP.code, 2); ctx.drawImage(big, Math.round(x + w / 2 - big.width / 2), yy + 7); yy += 30; }
      else { txt(`Visiting ${MP.hostName}'s Cedar Falls`, x + 8, yy, '#c8bce0', null); yy += 12; }
      const all = [{ pid: MP.pid, name: S.name + ' (you)' }, ...[...MP.players.values()].map(r => ({ pid: r.pid, name: r.name }))];
      all.sort((a, b) => a.pid === 'h' ? -1 : b.pid === 'h' ? 1 : a.pid.localeCompare(b.pid));
      for (const p of all) { ctx.fillStyle = MP.color(p.pid); ctx.fillRect(x + 10, yy + 3, 4, 4); txt(p.name + (p.pid === 'h' ? ' - host' : ''), x + 18, yy, '#f5ecd7', null); yy += 11; }
      yy += 2;
    }
    this.rects = [];
    its.forEach(([l], i) => { const ry = yy + i * 13; this.rects.push({ x, y: ry - 2, w, h: 13, i }); if (i === this.sel) { ctx.fillStyle = 'rgba(255,215,106,0.13)'; ctx.fillRect(x + 3, ry - 2, w - 6, 13); cursor(x + 6, ry); } txt(l, x + 16, ry, i === this.sel ? '#ffffff' : '#d8cce8'); });
  }
}
async function coopMenu() { await new Promise(r => UI.push(new CoopWin(r))); }
async function hostWorld() {
  if (MP.on) return;
  if (!S.slot) { const s = await slotPicker('save'); if (!s) return; saveGame(s); }
  const cw = new ConnWin('Opening Cedar Falls'); UI.push(cw);
  try { await MP.startHost(st => cw.status = st); }
  catch (e) { UI.close(cw); MP.reset(); await say('', e.message || 'Something went wrong opening your world.'); return; }
  if (cw.cancelled) { MP.reset(); return; }
  UI.close(cw); AU.sfx('quest');
  await say('', `Cedar Falls is open to friends! Your invite code is {y}${MP.code}{/}.|Friends pick {y}Co-op{/} then {y}Join a friend{/} on their title screen and type the code. Find it again any time under Menu > Co-op.`);
}
/* ---------- joining from the title screen ---------- */
async function titleCoop() {
  const c = await ask('', 'Co-op: play Cedar Falls together. Everyone keeps their own character and progress.', ['Join a friend', 'Host a world', 'How it works', 'Back']);
  if (c === 0) return joinFlow();
  if (c === 1) {
    const slot = await slotPicker('load'); if (!slot) return;
    MP.autoHost = true; loadSlot(slot);
  }
  if (c === 2) await say('', 'To host: load your save, then choose "Host a world" (or open the menu in game and pick Co-op). You\'ll get a 5-letter code.|To join: choose "Join a friend", pick the character you want to bring, and type the code.|Up to 4 players. Works on computers and phones. Your character saves on your own device.');
}
async function joinFlow(prefill) {
  const slot = await slotPicker('join'); if (!slot) return;
  let data = slotInfo(slot), isNew = false;
  if (!data) {
    const r = await new Promise(res => UI.push(new LookEditor({ mode: 'create', look: JSON.parse(JSON.stringify(DEFAULT_LOOK)), doneLabel: 'Hop on the bus ▶', res })));
    if (!r || !r.name) return;
    data = newState(r.name, r.look); data.slot = slot; isNew = true;
    try { localStorage.setItem('bth_slot_' + slot, JSON.stringify(data)); } catch (e) { } // keep the new character even if this join fails
    data.q = { welcome: 0, bed: 0 }; // same first steps as a solo start: Rosa has Walt's bike waiting
  }
  const code = await new Promise(res => UI.push(new CodeWin({ start: prefill || '', res })));
  if (!code) return;
  S = data; S.slot = slot;
  const cw = new ConnWin('Joining ' + code); UI.push(cw);
  let w;
  try { w = await MP.join(code, st => cw.status = st); }
  catch (e) { UI.close(cw); try { MP.peer && MP.peer.destroy(); } catch (x) { } MP.peer = null; S = null; await say('', e.message || 'Couldn\'t join that world.'); return; }
  if (cw.cancelled) { try { MP.hostConn && MP.hostConn.close(); MP.peer.destroy(); } catch (x) { } MP.peer = null; return; }
  UI.close(cw);
  if (isNew) { try { localStorage.setItem('bth_slot_' + slot, JSON.stringify(S)); } catch (e) { } }
  MP.beginGuest(w);
  await fadeOut(0.4);
  S.map = 'town'; S.x = 4; S.y = 22; S.dir = 'r';
  enterGame(false);
  MP.sys(`You joined ${MP.hostName}'s Cedar Falls!`);
  toast(TOUCH ? 'Tap CHAT to talk and EMOTE to react.' : 'Press T to chat and 1-8 for emotes.', 'chat');
  MP.sendState(true); MP.sendInfo(true);
}

/* ---------- boot ---------- */
(function boot() {
  AU.vol.music = OPT.music; AU.vol.sfx = OPT.sfx;
  resize();
  buildWorld();
  TitleArt.init();
  // installed to a home screen? let it open offline too (only on the real https site)
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  const bootEl = document.getElementById('boot'); if (bootEl) bootEl.remove();
  setScene(TitleScene);
  let last = performance.now(), lastTick = last;
  // co-op: browsers pause animation frames in hidden tabs, so keep the world ticking with a timer
  setInterval(() => {
    if (!MP.on) return; const now = performance.now(); if (now - lastTick < 300) return;
    const steps = Math.min(40, Math.round((now - lastTick) / 50)); lastTick = now;
    for (let i = 0; i < steps; i++) { Input.update(0.05); try { SCENE.update(0.05); } catch (e) { console.error(e); } Input.endFrame(); }
  }, 250);
  function loop(now) {
    lastTick = now;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    Input.update(dt);
    try { SCENE.update(dt); SCENE.draw(); }
    catch (e) { console.error(e); }
    Pad.draw();
    Input.endFrame();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  // tiny debug hook for testing (not shown to players)
  window.__bth = { G, get S() { return S; }, set S(v) { S = v; }, MAPS, setScene, TitleScene, GameScene, startNewGame, changeMap, newDay, UI, MP, loadSlot, saveGame, slotInfo, enterGame, newState, joinFlow, hostWorld, Input };
  window.__step = (n = 1) => { for (let i = 0; i < n; i++) { Input.update(1 / 60); SCENE.update(1 / 60); Input.endFrame(); } SCENE.draw(); };
})();
